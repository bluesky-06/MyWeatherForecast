<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Val Martin — AROME-HD</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fa;color:#17202a}
main{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{font-size:24px;margin:0 0 4px}.sub{color:#667085}
button{border:0;border-radius:10px;padding:10px 14px;background:#eee;font-size:16px}
#status{margin-left:10px;color:#667085}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:#667085}.temp{font-weight:700}.rain{color:#1769aa}
canvas{width:100%;height:180px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Val Martin — AROME-HD</h1>
<div class="sub">43.633308, 7.006525 · Modèle Météo-France</div>
<p><button onclick="load()">↻ Actualiser</button><span id="status">Chargement…</span></p>
</div>
<div class="card"><h2>Température</h2><canvas id="chart"></canvas></div>
<div class="card"><h2>Prévision horaire</h2>
<div style="overflow-x:auto"><table>
<thead><tr><th>Heure</th><th>🌡️ °C</th><th>💧 %</th><th>🌧️ mm</th><th>💨 km/h</th><th>💨 Rafale</th></tr></thead>
<tbody id="rows"></tbody></table></div></div>
</main>
<script>
const URL="https://api.open-meteo.com/v1/meteofrance?latitude=43.633308&longitude=7.006525&hourly=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&models=arome_france_hd&timezone=Europe%2FParis&forecast_days=2";
async function load(){
 const s=document.getElementById("status");s.textContent="Mise à jour…";
 try{
  const r=await fetch(URL);if(!r.ok)throw Error("HTTP "+r.status);
  const d=await r.json(),h=d.hourly;
  let now=new Date(),start=Math.max(0,h.time.findIndex(x=>new Date(x)>=now));if(start<0)start=0;
  let end=Math.min(start+36,h.time.length),rows="";
  for(let i=start;i<end;i++){
   let t=new Date(h.time[i]);
   let time=t.toLocaleString("fr-FR",{weekday:"short",hour:"2-digit",minute:"2-digit"});
   rows+=`<tr><td>${time}</td><td class="temp">${h.temperature_2m[i].toFixed(1)}</td><td>${h.relative_humidity_2m[i].toFixed(0)}</td><td class="rain">${h.precipitation[i].toFixed(1)}</td><td>${h.wind_speed_10m[i].toFixed(0)}</td><td>${h.wind_gusts_10m[i].toFixed(0)}</td></tr>`;
  }
  document.getElementById("rows").innerHTML=rows;
  draw(h.temperature_2m.slice(start,end));
  s.textContent="Actualisé à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
 }catch(e){s.textContent="Erreur : "+e.message}
}
function draw(vals){
 const c=document.getElementById("chart"),ctx=c.getContext("2d"),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
 c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);
 const min=Math.floor(Math.min(...vals)-1),max=Math.ceil(Math.max(...vals)+1);
 ctx.strokeStyle="#888";ctx.font="12px sans-serif";
 for(let j=0;j<5;j++){let y=20+j*(h-40)/4,v=max-j*(max-min)/4;ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(w-10,y);ctx.stroke();ctx.fillText(v.toFixed(0)+"°",3,y+4)}
 ctx.beginPath();vals.forEach((v,i)=>{let x=35+i*(w-45)/(vals.length-1),y=20+(max-v)*(h-40)/(max-min);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
}
load();
</script>
</body></html>
